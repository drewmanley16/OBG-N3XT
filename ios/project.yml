name: OBGVault
options:
  bundleIdPrefix: org.oregonblockchain
  deploymentTarget:
    iOS: "17.0"
packages:
  P256K:
    url: https://github.com/21-DOT-DEV/swift-secp256k1
    from: 0.23.0
  CryptoSwift:
    url: https://github.com/krzyzanowskim/CryptoSwift
    from: 1.8.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OBGVault:
    type: application
    platform: iOS
    sources: [OBGVault]
    dependencies:
      - package: P256K
        product: P256K
      - package: CryptoSwift
    info:
      path: OBGVault/Info.plist
      properties:
        CFBundleDisplayName: OBG Vault
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true # talk to the Speculos emulator on localhost
  OBGVaultTests:
    type: bundle.unit-test
    platform: iOS
    sources: [OBGVaultTests]
    dependencies:
      - target: OBGVault
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  OBGVaultUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [OBGVaultUITests]
    dependencies:
      - target: OBGVault
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OBGVault
schemes:
  OBGVault:
    build:
      targets:
        OBGVault: all
    test:
      targets: [OBGVaultTests, OBGVaultUITests]
