name: OBGVault
options:
  bundleIdPrefix: org.oregonblockchain
  deploymentTarget:
    iOS: "17.0"
packages:
  P256K:
    url: https://github.com/21-DOT-DEV/swift-secp256k1
    from: 0.23.0
  CryptoSwift:
    url: https://github.com/krzyzanowskim/CryptoSwift
    from: 1.8.0
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OBGVault:
    type: application
    platform: iOS
    sources: [OBGVault]
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        DEVELOPMENT_TEAM: X9H68STU8F
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: P256K
        product: P256K
      - package: CryptoSwift
      - package: Supabase
        product: Supabase
    info:
      path: OBGVault/Info.plist
      properties:
        CFBundleDisplayName: OBG Vault
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        SupabaseProjectRef: $(SUPABASE_PROJECT_REF)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        ProverHost: $(PROVER_HOST)
        SpeculosHost: $(SPECULOS_HOST)
        NSLocalNetworkUsageDescription: Connects to the prover and the Ledger emulator running on your Mac.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true # Speculos emulator and the prover on localhost
  OBGVaultTests:
    type: bundle.unit-test
    platform: iOS
    sources: [OBGVaultTests]
    dependencies:
      - target: OBGVault
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  OBGVaultUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [OBGVaultUITests]
    dependencies:
      - target: OBGVault
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OBGVault
schemes:
  OBGVault:
    build:
      targets:
        OBGVault: all
    test:
      targets: [OBGVaultTests, OBGVaultUITests]
